aid: altvia
name: Altvia
description: Altvia is fund management software purpose-built for private capital markets, serving private equity,
  venture capital, fund of funds, real estate, hedge funds, family offices, and placement agents. Built on the Salesforce
  platform, Altvia unifies a purpose-built CRM, a virtual data room (VDR) and LP investor portal, analytics and
  reporting, and an AI assistant (AIMe) into one system that spans the full fund lifecycle — capital raising, investor
  relations, and deal management. Founded in 2006 and based in Broomfield, Colorado, Altvia was acquired by Marlin
  Equity Partners in 2022. The company exposes no public developer/API portal; integrations are delivered through
  the platform and the Salesforce ecosystem.
